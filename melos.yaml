name: structured_log_workspace

packages:
  - structured_log

command:
  bootstrap:
    runPubGetInParallel: false

scripts:
  pubget:
    exec: dart pub get
    description: Get dependencies for each package

  analyze:
    exec: dart analyze
    description: Analyze Dart code for each package

  format:
    exec: dart format .
    description: Format Dart code for each package

  format:check:
    exec: dart format --set-exit-if-changed .
    description: Check code formatting for each package

  test:
    exec: dart test
    description: Run tests for each package

  test:coverage:
    exec: dart test --coverage=coverage
    description: Run tests with coverage for each package

  lint:
    steps:
      - analyze
      - format:check
    description: Run all linting checks

  build:
    steps:
      - pubget
      - analyze
    description: Get dependencies and analyze

  clean:
    run: dart pub cache clean
    description: Clean pub cache

  example:
    exec: dart run example/main.dart
    packageFilters:
      scope: ["structured_log"]
    description: Run the structured_log example
sdkPath: .fvm/flutter_sdk
