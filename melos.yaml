name: structured_log_workspace

packages:
  - structured_log
  - structured_log_flutter
  - structured_log_material

command:
  bootstrap:
    runPubGetInParallel: false

scripts:
  pubget:
    exec: dart pub get
    description: Get dependencies for each package

  analyze:
    exec: dart analyze
    description: Analyze Dart code for each package

  format:
    exec: dart format .
    description: Format Dart code for each package

  format:check:
    exec: dart format --set-exit-if-changed .
    description: Check code formatting for each package

  test:
    steps:
      - test:dart
      - test:flutter
    description: Run tests for all packages

  test:dart:
    exec: dart test
    packageFilters:
      scope: ["structured_log"]
    description: Run tests for Dart-only packages

  test:flutter:
    exec: flutter test
    packageFilters:
      scope: ["structured_log_flutter", "structured_log_material"]
    description: Run tests for Flutter packages

  test:coverage:
    exec: dart test --coverage=coverage
    packageFilters:
      scope: ["structured_log"]
    description: Run tests with coverage (Dart-only packages)

  lint:
    steps:
      - analyze
      - format:check
    description: Run all linting checks

  build:
    steps:
      - pubget
      - analyze
    description: Get dependencies and analyze

  clean:
    run: dart pub cache clean
    description: Clean pub cache

  example:
    exec: dart run example/main.dart
    packageFilters:
      scope: ["structured_log"]
    description: Run the structured_log example
sdkPath: .fvm/flutter_sdk
