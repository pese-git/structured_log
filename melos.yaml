name: structured_log_workspace

packages:
  - emb/structured_log
  - emb/structured_log_flutter
  - emb/structured_log_material
  - emb/structured_log_material/example
  - emb/structured_log_fluent
  - emb/structured_log_fluent/example
  - emb/structured_log_cupertino
  - emb/structured_log_cupertino/example
  - emb/structured_log_http
  - backend/structured_log_server
  - frontend/structured_log_admin_ui

command:
  bootstrap:
    runPubGetInParallel: false

scripts:
  pubget:
    exec: dart pub get
    description: Get dependencies for each package

  analyze:
    exec: dart analyze
    description: Analyze Dart code for each package

  format:
    exec: dart format .
    description: Format Dart code for each package

  format:check:
    exec: dart format --set-exit-if-changed .
    description: Check code formatting for each package

  test:
    steps:
      - test:dart
      - test:flutter
    description: Run tests for all packages

  test:dart:
    exec: dart test
    packageFilters:
      scope: ["structured_log", "structured_log_server", "structured_log_http"]
    description: Run tests for Dart-only packages

  test:flutter:
    exec: flutter test
    packageFilters:
      scope: [
        "structured_log_flutter",
        "structured_log_material",
        "structured_log_material_example",
        "structured_log_fluent",
        "structured_log_fluent_example",
        "structured_log_cupertino",
        "structured_log_cupertino_example",
        "structured_log_admin_ui",
      ]
    description: Run tests for Flutter packages

  test:coverage:
    exec: dart test --coverage=coverage
    packageFilters:
      scope: ["structured_log"]
    description: Run tests with coverage (Dart-only packages)

  generate:
    exec: dart run build_runner build --delete-conflicting-outputs
    packageFilters:
      scope: ["structured_log_server"]
    description: Run code generation (drift/freezed/json_serializable) for structured_log_server

  lint:
    steps:
      - analyze
      - format:check
    description: Run all linting checks

  build:
    steps:
      - pubget
      - analyze
    description: Get dependencies and analyze

  clean:
    run: dart pub cache clean
    description: Clean pub cache

  example:
    exec: dart run example/main.dart
    packageFilters:
      scope: ["structured_log"]
    description: Run the structured_log example
sdkPath: .fvm/flutter_sdk
