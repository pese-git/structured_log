# Referenced by name from ingress.yaml's `/v1` backend — the `web` image
# has no idea this Service exists at all (unlike docker-compose.yml's
# `proxy` container, which does, by the same name, for the same reason).
# Rename this and update ingress.yaml to match; nothing else cares.
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: structured-log
spec:
  selector:
    app: structured-log-server
  ports:
    - port: 8080
      targetPort: 8080
