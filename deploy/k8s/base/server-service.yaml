# Named "server" — the web image's baked-in nginx.conf.template
# (deploy/nginx.conf.template) defaults `location /v1/` to
# `proxy_pass http://server:8080`, the same name docker-compose.yml uses
# for the same single-origin/no-CORS reason (see deploy/k8s/README.md).
# Resolution is lazy (a `resolver` directive, not a bare literal), so
# renaming this without also rebuilding the image no longer crashes the
# web container — it just answers `502` on `/v1/` instead of proxying.
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: structured-log
spec:
  selector:
    app: structured-log-server
  ports:
    - port: 8080
      targetPort: 8080
