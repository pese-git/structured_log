apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: structured-log
  namespace: structured-log
  annotations:
    # The live-stream endpoint (GET /v1/logs/stream) is a long-lived
    # response; don't buffer or time it out like an ordinary request
    # (mirrors deploy/nginx.conf's own settings for the same endpoint).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: logs.example.com
      http:
        paths:
          # Everything goes to `web` — its own nginx (deploy/nginx.conf)
          # already splits `/v1/` off to the `server` Service internally.
          # Duplicating that split at the Ingress level would be two
          # places to keep in sync.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 80}
