apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: structured-log
  namespace: structured-log
  annotations:
    # The live-stream endpoint (GET /v1/logs/stream) is a long-lived
    # response; don't buffer or time it out like an ordinary request
    # (mirrors deploy/proxy/nginx.conf.template's own settings for the
    # same endpoint, for the docker-compose path).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: logs.example.com
      http:
        paths:
          # `/v1` straight to `server`, everything else to `web` — the
          # split docker-compose.yml needs its own `proxy` container for
          # (see deploy/proxy/) is exactly what an Ingress already does,
          # no extra container needed. `web` doesn't proxy anything itself;
          # ingress-nginx sorts by path specificity, so `/v1` always wins
          # over `/` regardless of list order.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: server
                port: {number: 8080}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 80}
