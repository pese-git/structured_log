server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A static multi-page site (Astro/Starlight), not an SPA — every route
  # Starlight generates is a real file (`/path/index.html`), so a path
  # that matches none of them is a genuine 404, not a client-side route
  # to hand off to index.html.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
