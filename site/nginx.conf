# Security headers at server level, so they reach every page and every asset.
# `add_header` does not accumulate across levels: a `location` that sets one
# drops all of these, so anything added later repeats the block.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # This policy is weaker than the admin client's, and deliberately so rather
  # than by oversight.
  #
  # `script-src` carries `'unsafe-inline'` because Starlight emits about ten
  # inline scripts per page — theme selection, the sidebar, the search dialog
  # — and a static host has no nonce to give them. Pinning their hashes would
  # mean regenerating this file on every dependency bump, which is a promise
  # that gets broken quietly. `style-src`/`font-src` name Google Fonts
  # because the site loads JetBrains Mono from there.
  #
  # What it still buys, with `script-src` as loose as it is: no plugins
  # (`object-src`), no framing (`frame-ancestors`), no rewriting of relative
  # URLs (`base-uri`), no posting anywhere else (`form-action`), and no
  # network calls off-origin (`connect-src`). Tightening `script-src` is a
  # build-side job — self-host the font and have Astro emit hashes — not
  # something this file can do alone.
  #
  # Verified against a real `npm run build`: no console errors, client-side
  # Mermaid renders, and Pagefind search (WebAssembly, in a worker) returns
  # results.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; form-action 'self'" always;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;

  # `strict-origin-when-cross-origin`, not the client's `no-referrer`: this is
  # public documentation, and a link out of it saying which site it came from
  # is ordinary and useful. What the client protects — ids in the path — does
  # not exist here.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  # No `Strict-Transport-Security`, for the same reason as the admin client's
  # image: this container never terminates TLS, and HSTS is a claim about a
  # whole hostname that belongs to whoever does.

  # A static multi-page site (Astro/Starlight), not an SPA — every route
  # Starlight generates is a real file (`/path/index.html`), so a path
  # that matches none of them is a genuine 404, not a client-side route
  # to hand off to index.html.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
