name: structured_log_server
description: >-
  Self-hosted, multi-tenant log ingestion/query/live-stream server for
  structured_log — HTTP API, storage, auth, RBAC, quotas.
version: 0.1.0-dev.0
publish_to: none

environment:
  sdk: ^3.0.0

dependencies:
  bcrypt: ^1.1.3
  crypto: ^3.0.3
  dart_jsonwebtoken: ^3.1.0
  drift: ^2.20.3
  fpdart: ^1.1.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  mailer: ^6.1.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sqlite3: ^2.5.0
  structured_log: ^0.2.0-dev.0+1

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  lints: ^3.0.0
  test: ^1.24.0
