name: structured_log_riverpod
description: >-
  StructuredLogRiverpodObserver — a ProviderObserver that turns the lifecycle
  of every Riverpod provider (created, updated, failed, removed) into
  structured_log entries. Works with flutter_riverpod as is.
version: 0.1.0-dev.0
homepage: https://structured-log.openidealab.com
documentation: https://structured-log.openidealab.com/packages/structured_log_riverpod/
repository: https://github.com/pese-git/structured_log.git
topics:
  - logging
  - riverpod
  - state-management
  - structured-logging
  - debugging

environment:
  sdk: ^3.8.0

dependencies:
  riverpod: ^3.0.0
  structured_log: ^0.3.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
