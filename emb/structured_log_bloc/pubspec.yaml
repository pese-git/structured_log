name: structured_log_bloc
description: >-
  StructuredLogBlocObserver — a BlocObserver that turns the lifecycle, events,
  state changes and errors of every bloc and cubit into structured_log entries.
  Works with flutter_bloc as is.
version: 0.1.0-dev.4
homepage: https://structured-log.openidealab.com
documentation: https://structured-log.openidealab.com/packages/structured_log_bloc/
repository: https://github.com/pese-git/structured_log.git
topics:
  - logging
  - bloc
  - state-management
  - structured-logging
  - debugging

environment:
  sdk: ^3.0.0

dependencies:
  bloc: ^9.0.0
  structured_log: ^0.3.0+1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
