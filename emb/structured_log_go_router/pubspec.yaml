name: structured_log_go_router
description: >-
  StructuredLogGoRouter — logs every go_router navigation, redirect and
  routing error as structured_log entries, with token-like query parameters
  in the location redacted.
version: 0.1.0-dev.6
homepage: https://structured-log.openidealab.com
documentation: https://structured-log.openidealab.com/packages/structured_log_go_router/
repository: https://github.com/pese-git/structured_log.git
topics:
  - logging
  - go-router
  - navigation
  - routing
  - structured-logging

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ">=17.0.0 <19.0.0"
  structured_log: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0
