name: structured_log_http_client
description: >-
  StructuredLogHttpClient — a package:http Client wrapper that logs every
  request, response and failure as structured_log entries, with sensitive
  headers and query parameters redacted.
version: 0.1.0-dev.3
homepage: https://structured-log.openidealab.com
documentation: https://structured-log.openidealab.com/packages/structured_log_http_client/
repository: https://github.com/pese-git/structured_log.git
topics:
  - logging
  - http
  - http-client
  - network
  - structured-logging

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.5.0
  structured_log: ^0.3.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
