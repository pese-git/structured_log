name: structured_log_cherrypick
description: >-
  StructuredLogCherryPickObserver — a CherryPickObserver that logs the scopes,
  modules, cycles and errors of a cherrypick container as structured_log
  entries, never an instance.
version: 0.1.0-dev.8
homepage: https://structured-log.openidealab.com
documentation: https://structured-log.openidealab.com/packages/structured_log_cherrypick/
repository: https://github.com/pese-git/structured_log.git
topics:
  - logging
  - cherrypick
  - dependency-injection
  - di
  - structured-logging

environment:
  sdk: ^3.2.0

dependencies:
  cherrypick: ">=3.0.0 <5.0.0"
  structured_log: ^0.3.2+2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
