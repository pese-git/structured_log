name: structured_log_material
description: >-
  A Material 3 in-app log viewer for structured_log — live list, expanded
  entry detail, and empty states, built on structured_log_flutter.
version: 0.1.2
homepage: https://structured-log.openidealab.com
documentation: https://structured-log.openidealab.com/packages/structured_log_material/
repository: https://github.com/pese-git/structured_log.git
topics:
  - logging
  - log-viewer
  - material-design
  - widget
  - debugging

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  structured_log: ^0.3.1
  structured_log_flutter: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0
