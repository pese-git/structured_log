name: structured_log_drift
description: >-
  StructuredLogDriftInterceptor — a drift QueryInterceptor that logs every
  query, batch, failure and transaction end as a structured_log entry, with
  its duration and slow queries flagged; argument values stay out by default.
version: 0.1.0-dev.3
homepage: https://structured-log.openidealab.com
documentation: https://structured-log.openidealab.com/packages/structured_log_drift/
repository: https://github.com/pese-git/structured_log.git
topics:
  - logging
  - drift
  - database
  - structured-logging
  - debugging

environment:
  sdk: ^3.0.0

dependencies:
  drift: ">=2.14.0 <3.0.0"
  structured_log: ^0.3.2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
