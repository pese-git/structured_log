name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Analyze & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: emb/structured_log
    strategy:
      fail-fast: false
      matrix:
        # ubuntu/macos/windows matter here: async_file_output.dart and the
        # rotating outputs do real file rename/delete/exists calls, and
        # file-locking semantics differ enough between POSIX and Windows
        # that it's worth actually running the suite on all three.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          # Only one of these exists per OS; actions/cache skips the other.
          path: |
            ~/.pub-cache
            %LOCALAPPDATA%\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('emb/structured_log/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

      - name: Run example
        run: dart run example/main.dart

  server:
    name: Analyze & test (structured_log_server)
    runs-on: ubuntu-latest
    # Single OS, like the Flutter job: this package doesn't do the
    # OS-sensitive file rotation that makes the structured_log job run on
    # three, and it's a self-hosted service that only ever runs on Linux.
    defaults:
      run:
        working-directory: backend/structured_log_server

    steps:
      - uses: actions/checkout@v4

      # Dart-only: the server doesn't depend on Flutter, so no FVM either.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('backend/structured_log_server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # `melos bootstrap` would do this, but melos.yaml pins sdkPath to the
      # FVM Flutter SDK, which CI doesn't have. Written out by hand instead,
      # mirroring the pubspec_overrides.yaml melos generates locally: without
      # it pub resolves the published structured_log and a breaking change
      # made to emb/structured_log in the same PR would go unnoticed here.
      - name: Link the workspace copy of structured_log
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            structured_log:
              path: ../../emb/structured_log
          EOF

      - name: Install dependencies
        run: dart pub get

      # Must precede analyze and test: drift, freezed, json_serializable and
      # shelf_router_generator all produce code the package does not compile
      # without (the route table among it), and *.g.dart is not committed.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      # Split from the integration run below only so the log says which of
      # the two failed: `integration` is declared in dart_test.yaml but not
      # excluded, so a plain `dart test` would run both anyway.
      - name: Run tests
        run: dart test --exclude-tags integration

      # These spawn bin/server.dart as a real OS process. They are the only
      # tests that exercise anything the in-process handler can't show —
      # config resolved from a separate process's environment, SSE actually
      # reaching a socket, and shutdown behaviour on a signal.
      - name: Run integration tests
        run: dart test --tags integration

  e2e:
    name: End-to-end (packages/e2e)
    runs-on: ubuntu-latest
    # The whole system in one process tree: bin/server.dart started for real,
    # the logging library and its HTTP sender shipping into it, and the admin
    # client's data layer reading back out. Its own job because it is the only
    # one that needs two packages' generated code and a Flutter SDK at the
    # same time.
    defaults:
      run:
        working-directory: packages/e2e

    steps:
      - uses: actions/checkout@v4

      # A Flutter package, because the admin client is one and this suite
      # exercises that client rather than a stand-in for it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-e2e-${{ hashFiles('packages/e2e/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Both halves generate code that is not committed, and both are needed
      # before anything here compiles or runs: the client because this package
      # imports it, the server because the harness starts it.
      - name: Generate the server's code
        working-directory: backend/structured_log_server
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate the client's code
        working-directory: frontend/structured_log_admin_client
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run end-to-end tests
        run: flutter test

  http-sender:
    name: Analyze & test (structured_log_http)
    runs-on: ubuntu-latest
    # Pure Dart, no code generation and no OS-sensitive behaviour: its own
    # job rather than a matrix entry beside structured_log_server, which
    # would drag the build_runner step along for nothing.
    defaults:
      run:
        working-directory: emb/structured_log_http

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('emb/structured_log_http/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Same reason as the server job: without the override pub resolves the
      # published structured_log, and a breaking change to it in the same PR
      # would go unnoticed here.
      - name: Link the workspace copy of structured_log
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            structured_log:
              path: ../structured_log
          EOF

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

  flutter:
    name: Analyze & test Flutter (${{ matrix.package }})
    runs-on: ubuntu-latest
    # A single OS is enough for these packages, unlike the Dart-only job
    # above: they don't do the OS-sensitive file rotation that requires
    # covering ubuntu/macos/windows. Revisit if that changes.
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - emb/structured_log_flutter
          - emb/structured_log_material
          - emb/structured_log_material/example
          - emb/structured_log_fluent
          - emb/structured_log_fluent/example
          - emb/structured_log_cupertino
          - emb/structured_log_cupertino/example
          - frontend/structured_log_admin_ui
          - frontend/structured_log_admin_ui/example
          - frontend/structured_log_admin_client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      # Only structured_log_admin_client uses build_runner (freezed /
      # json_serializable / retrofit). It must run before analyze and test:
      # *.g.dart and *.freezed.dart are not committed, so without it the
      # package does not compile — same rule as the server job.
      - name: Generate code
        if: matrix.package == 'frontend/structured_log_admin_client'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
