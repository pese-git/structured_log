name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Analyze & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: emb/structured_log
    strategy:
      fail-fast: false
      matrix:
        # ubuntu/macos/windows matter here: async_file_output.dart and the
        # rotating outputs do real file rename/delete/exists calls, and
        # file-locking semantics differ enough between POSIX and Windows
        # that it's worth actually running the suite on all three.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          # Only one of these exists per OS; actions/cache skips the other.
          path: |
            ~/.pub-cache
            %LOCALAPPDATA%\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('emb/structured_log/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: dart test

      # Coverage is collected on one OS only: the number does not differ by
      # platform, and instrumenting all three would triple the cost of the
      # slowest job for the same answer.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: dart test --coverage=coverage

      - name: Check coverage against its floor
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --lcov \
            --in=emb/structured_log/coverage \
            --out=emb/structured_log/coverage/lcov.info \
            --report-on=emb/structured_log/lib \
            --packages=emb/structured_log/.dart_tool/package_config.json
          dart tool/coverage_floor.dart --package structured_log \
            --lcov emb/structured_log/coverage/lcov.info

      - name: Run example
        run: dart run example/main.dart

  server:
    name: Analyze & test (structured_log_server)
    runs-on: ubuntu-latest
    # Single OS, like the Flutter job: this package doesn't do the
    # OS-sensitive file rotation that makes the structured_log job run on
    # three, and it's a self-hosted service that only ever runs on Linux.
    defaults:
      run:
        working-directory: backend/structured_log_server
    # For the `postgres`-tagged suite (add-postgres-backend). A GitHub
    # Actions service container, not a manual `docker run` + wait loop like
    # chromedriver below: unlike chromedriver, Postgres has first-class
    # `services:` support with a built-in health check, and the runner
    # blocks every step until it reports healthy — nothing to wait for by
    # hand. Credentials match the test suite's defaults
    # (`STRUCTURED_LOG_TEST_POSTGRES_*`, see dart_test.yaml).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Dart-only: the server doesn't depend on Flutter, so no FVM either.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('backend/structured_log_server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # `melos bootstrap` would do this, but melos.yaml pins sdkPath to the
      # FVM Flutter SDK, which CI doesn't have. Written out by hand instead,
      # mirroring the pubspec_overrides.yaml melos generates locally: without
      # it pub resolves the published structured_log and a breaking change
      # made to emb/structured_log in the same PR would go unnoticed here.
      - name: Link the workspace copy of structured_log
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            structured_log:
              path: ../../emb/structured_log
          EOF

      - name: Install dependencies
        run: dart pub get

      # Must precede analyze and test: drift, freezed, json_serializable and
      # shelf_router_generator all produce code the package does not compile
      # without (the route table among it), and *.g.dart is not committed.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      # Split from the integration/Postgres runs below only so the log says
      # which of the three failed: none of these tags are excluded by
      # dart_test.yaml itself, so a plain `dart test` would run all three
      # here. `postgres`-tagged files throw a clear `StateError` in
      # `setUpAll` without `STRUCTURED_LOG_TEST_POSTGRES_PASSWORD` set (see
      # dart_test.yaml) — excluding the tag here, not setting the var, is
      # what keeps this step SQLite-only.
      - name: Run tests
        run: dart test --coverage=coverage/unit --exclude-tags integration --exclude-tags postgres

      # These spawn bin/server.dart as a real OS process. They are the only
      # tests that exercise anything the in-process handler can't show —
      # config resolved from a separate process's environment, SSE actually
      # reaching a socket, and shutdown behaviour on a signal.
      # Not instrumented, on two measurements rather than taste: these run
      # the server as a *separate process*, whose coverage the collector
      # never sees — the whole suite adds 1.4% against the unit run's 91.1%
      # — and under `--coverage` two of its fourteen tests failed once and
      # passed on the next run, which is a flake bought for nothing.
      - name: Run integration tests
        run: dart test --tags integration

      # Dialect-sensitive code the SQLite-backed suite above can't exercise
      # (add-postgres-backend design.md, decision 10). --concurrency=1 is
      # required, not a style choice: these files share one physical
      # database with no per-file isolation the way SQLite's
      # NativeDatabase.memory() gives each test, and run at default
      # concurrency they corrupt each other's fixtures (see dart_test.yaml).
      - name: Run Postgres-backed tests
        env:
          STRUCTURED_LOG_TEST_POSTGRES_HOST: localhost
          STRUCTURED_LOG_TEST_POSTGRES_PORT: '5432'
          STRUCTURED_LOG_TEST_POSTGRES_DATABASE: postgres
          STRUCTURED_LOG_TEST_POSTGRES_USERNAME: postgres
          STRUCTURED_LOG_TEST_POSTGRES_PASSWORD: postgres
        run: dart test --coverage=coverage/postgres --tags postgres --concurrency=1

      # Two runs, one number: the SQLite suite above and the Postgres one
      # exercise different halves of `storage/database.dart`, and a floor
      # meeting only the half that runs by default would ask nothing of the
      # other. `format_coverage` reads one directory at a time, so each is
      # rendered separately and the two reports are concatenated — a file
      # measured by both arrives twice, and the gate merges it line by line.
      - name: Check coverage against its floor
        working-directory: .
        run: |
          dart pub global activate coverage
          for run in unit postgres; do
            dart pub global run coverage:format_coverage --lcov \
              --in=backend/structured_log_server/coverage/$run \
              --out=backend/structured_log_server/coverage/$run.info \
              --report-on=backend/structured_log_server/lib \
              --packages=backend/structured_log_server/.dart_tool/package_config.json
          done
          cat backend/structured_log_server/coverage/unit.info \
            backend/structured_log_server/coverage/postgres.info \
            > backend/structured_log_server/coverage/lcov.info
          dart tool/coverage_floor.dart --package structured_log_server \
            --lcov backend/structured_log_server/coverage/lcov.info

  e2e:
    name: End-to-end (packages/e2e)
    runs-on: ubuntu-latest
    # The whole system in one process tree: bin/server.dart started for real,
    # the logging library and its HTTP sender shipping into it, and the admin
    # client's data layer reading back out. Its own job because it is the only
    # one that needs two packages' generated code and a Flutter SDK at the
    # same time.
    defaults:
      run:
        working-directory: packages/e2e

    steps:
      - uses: actions/checkout@v4

      # A Flutter package, because the admin client is one and this suite
      # exercises that client rather than a stand-in for it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-e2e-${{ hashFiles('packages/e2e/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Both halves generate code that is not committed, and both are needed
      # before anything here compiles or runs: the client because this package
      # imports it, the server because the harness starts it.
      - name: Generate the server's code
        working-directory: backend/structured_log_server
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate the client's code
        working-directory: frontend/structured_log_admin_client
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run end-to-end tests
        run: flutter test

  http-sender:
    name: Analyze & test (structured_log_http)
    runs-on: ubuntu-latest
    # Pure Dart, no code generation and no OS-sensitive behaviour: its own
    # job rather than a matrix entry beside structured_log_server, which
    # would drag the build_runner step along for nothing.
    defaults:
      run:
        working-directory: emb/structured_log_http

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('emb/structured_log_http/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Same reason as the server job: without the override pub resolves the
      # published structured_log, and a breaking change to it in the same PR
      # would go unnoticed here.
      - name: Link the workspace copy of structured_log
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            structured_log:
              path: ../structured_log
          EOF

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      - name: Check coverage against its floor
        working-directory: .
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --lcov \
            --in=emb/structured_log_http/coverage \
            --out=emb/structured_log_http/coverage/lcov.info \
            --report-on=emb/structured_log_http/lib \
            --packages=emb/structured_log_http/.dart_tool/package_config.json
          dart tool/coverage_floor.dart --package structured_log_http \
            --lcov emb/structured_log_http/coverage/lcov.info

  admin-client-flow:
    name: Drive the admin client in a browser
    runs-on: ubuntu-latest
    # Its own job rather than a row in the matrix below, because it is not
    # `flutter test`. `flutter test` runs on a binding that stands in for the
    # user — it registers a fake text input and answers 400 to every HTTP
    # request — and the defect this guards against (a dialog that closed
    # itself twice and took the one and only view of a new secret key with it)
    # reproduces only on a real renderer with real frames. The widget suite
    # passed with it present.
    defaults:
      run:
        working-directory: frontend/structured_log_admin_client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: >-
            ${{ runner.os }}-pub-${{
              hashFiles('frontend/structured_log_admin_client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      # Same rule as everywhere else this package is built: *.g.dart and
      # *.freezed.dart are not committed, so nothing compiles without this.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # `flutter drive` on web talks to a WebDriver server rather than
      # launching the browser itself. The runner image ships ChromeDriver
      # alongside Chrome, but only promises it under $CHROMEWEBDRIVER rather
      # than on PATH, so take either. Waiting for it to answer keeps the step
      # below from racing a process that has not bound its port yet.
      - name: Start chromedriver
        run: |
          driver="$(command -v chromedriver || echo "$CHROMEWEBDRIVER/chromedriver")"
          echo "using $driver"
          nohup "$driver" --port=4444 > /tmp/chromedriver.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4444/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chromedriver.log
          exit 1

      # `-d web-server`, never `-d chrome`: with the latter Flutter launches a
      # browser of its own, the driver never gets a WebDriver session, and the
      # run hangs until it is killed rather than reporting anything. Headless
      # is the default for this command.
      - name: Drive the operator's path
        run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/user_flow_test.dart
          -d web-server
          --browser-name=chrome

  shell:
    name: Shellcheck the deployment scripts
    runs-on: ubuntu-latest
    # Three scripts stand between a working tree and a running deployment —
    # `deploy/deploy.sh` and the two under `deploy/k8s/` — and nothing
    # checked them. They are not Dart, so no other job here looks at them;
    # they are not run by any test, so a mistake in one waits for whoever
    # deploys next to find it.
    #
    # What this catches is the class a reader skims past: an unquoted
    # expansion that word-splits on a path with a space, a variable whose
    # name is misspelled in one of its uses, a `[` test that means something
    # other than it reads. Not logic — `shellcheck` has no idea what these
    # scripts are for — and, worth saying because it was the reason this job
    # was proposed, **not** a shell other than the one declared: the mistake
    # that prompted it was `"$repo:latest"` typed into an interactive zsh,
    # where `:l` is the lowercase modifier and the result is a plausible
    # wrong name. That is valid `bash`, so `shellcheck` passes it, and every
    # script here declares `#!/usr/bin/env bash` and is run as bash.
    #
    # Default severity: everything `shellcheck` reports fails the job. The
    # three scripts are clean at that setting today, so there is no backlog
    # to grandfather and nothing to argue about later — the first finding
    # will be one somebody just introduced.

    steps:
      - uses: actions/checkout@v4

      # The runner image ships shellcheck; `shellcheck --version` in the log
      # records which one, since a newer release can add a check that turns
      # a passing script red without anyone having touched it.
      - name: Check the scripts
        run: |
          shellcheck --version
          shellcheck deploy/deploy.sh \
                     deploy/k8s/build-images.sh \
                     deploy/k8s/create-secrets.sh

  tools:
    name: Analyze & test repository tooling
    runs-on: ubuntu-latest
    # The workspace root is not a package anyone ships; it holds one piece
    # of code — tool/coverage_floor.dart, the gate every other job calls —
    # and that code decides whether builds pass, so it gets the same
    # treatment as the packages it judges.

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed tool test

      - name: Analyze
        run: dart analyze tool test

      - name: Run tests
        run: dart test

  site:
    name: Build the project website
    runs-on: ubuntu-latest
    # Node, not Dart/Flutter: site/ is a standalone Astro project outside
    # the Melos workspace (see AGENTS.md). Its content (src/content/docs/,
    # minus the two hand-authored landing pages) is generated from docs/ by
    # scripts/migrate_docs.py rather than committed — same convention as
    # *.g.dart elsewhere in this repo — and `npm run build`'s `prebuild`
    # hook runs it automatically. The check that matters here is "does
    # docs/ still produce a site that builds", not "is checked-in output
    # current": there is no checked-in output to go stale.
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  flutter:
    name: Analyze & test Flutter (${{ matrix.package }})
    runs-on: ubuntu-latest
    # A single OS is enough for these packages, unlike the Dart-only job
    # above: they don't do the OS-sensitive file rotation that requires
    # covering ubuntu/macos/windows. Revisit if that changes.
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    strategy:
      fail-fast: false
      # `name` is the key this package has in tool/coverage_floors.json, and
      # an entry without one is not measured: the example apps are demos
      # whose tests exist to keep the demo compiling, and a floor on them
      # would be a number nobody has a reason to defend.
      matrix:
        include:
          - package: emb/structured_log_flutter
            name: structured_log_flutter
          - package: emb/structured_log_material
            name: structured_log_material
          - package: emb/structured_log_material/example
          - package: emb/structured_log_fluent
            name: structured_log_fluent
          - package: emb/structured_log_fluent/example
          - package: emb/structured_log_cupertino
            name: structured_log_cupertino
          - package: emb/structured_log_cupertino/example
          - package: frontend/structured_log_admin_ui
            name: structured_log_admin_ui
          - package: frontend/structured_log_admin_ui/example
          - package: frontend/structured_log_admin_client
            name: structured_log_admin_client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      # Only structured_log_admin_client uses build_runner (freezed /
      # json_serializable / retrofit). It must run before analyze and test:
      # *.g.dart and *.freezed.dart are not committed, so without it the
      # package does not compile — same rule as the server job.
      - name: Generate code
        if: matrix.package == 'frontend/structured_log_admin_client'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        if: matrix.name == ''
        run: flutter test

      - name: Run tests with coverage
        if: matrix.name != ''
        run: flutter test --coverage

      # `flutter test --coverage` writes lcov itself, so unlike the Dart
      # jobs there is no `format_coverage` step here.
      - name: Check coverage against its floor
        if: matrix.name != ''
        working-directory: .
        run: |
          dart tool/coverage_floor.dart --package ${{ matrix.name }} \
            --lcov ${{ matrix.package }}/coverage/lcov.info
