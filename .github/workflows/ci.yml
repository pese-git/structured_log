name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Analyze & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: structured_log
    strategy:
      fail-fast: false
      matrix:
        # ubuntu/macos/windows matter here: async_file_output.dart and the
        # rotating outputs do real file rename/delete/exists calls, and
        # file-locking semantics differ enough between POSIX and Windows
        # that it's worth actually running the suite on all three.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          # Only one of these exists per OS; actions/cache skips the other.
          path: |
            ~/.pub-cache
            %LOCALAPPDATA%\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('structured_log/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

      - name: Run example
        run: dart run example/main.dart
