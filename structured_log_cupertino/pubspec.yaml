name: structured_log_cupertino
description: >-
  A Cupertino (iOS-style) in-app log viewer for structured_log, built on
  structured_log_flutter.
version: 0.1.0-dev.2
repository: https://github.com/pese-git/structured_log.git

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  structured_log: ^0.2.0-dev.0+1
  structured_log_flutter: ^0.1.0-dev.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  uses-material-design: false
