# Security headers are set once, at server level, so they reach every response
# this image produces — the document, the JS, the fonts and a 404 alike.
#
# `add_header` does not accumulate across levels: a `location` that sets one of
# its own drops every inherited header. Nothing here does, and anything added
# later must repeat the whole block rather than add a line to it.
#
# `always` so they survive error responses too; a 404 rendered by nginx is
# still a document a browser will parse.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The bundle is entirely self-contained — the build passes
  # `--no-web-resources-cdn`, so the rendering engine comes from
  # `/canvaskit/` here rather than from `www.gstatic.com`, and no font is
  # fetched from `fonts.gstatic.com`. That is what lets this be `'self'`
  # rather than an allow-list of Google origins. Verified by loading the
  # release bundle under exactly this policy: no console errors, no external
  # requests. Dropping the build flag brings both back and leaves a blank
  # page.
  #
  # `connect-src 'self'` assumes the single-origin deployment this repository
  # ships (`deploy/`): the API answers under `/v1/` on the same host. An
  # operator who instead serves the API from another origin and opens it with
  # `--cors-allowed-origins` has to name that origin here as well, or the
  # browser will block the call before CORS is even consulted.
  #
  # `style-src` needs `'unsafe-inline'`: the Flutter engine writes inline
  # styles while laying out text, and there is no build setting that stops it.
  # `script-src` needs neither `'unsafe-inline'` nor `'unsafe-eval'`;
  # `'wasm-unsafe-eval'` is there because the engine instantiates its
  # WebAssembly module.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; form-action 'self'" always;

  # `frame-ancestors` above already says this to every browser that reads CSP.
  # Kept for the ones that do not, and because an admin panel inside somebody
  # else's frame is a clickjacking target: the reader sees their own session
  # and clicks what the attacker has positioned under the cursor.
  add_header X-Frame-Options "DENY" always;

  # A response served as `text/plain` stays `text/plain`. Without this a
  # browser may sniff an uploaded or mistyped file into something executable.
  add_header X-Content-Type-Options "nosniff" always;

  # URLs here carry group, project and user ids. Nothing outside needs to
  # learn them from a `Referer`.
  add_header Referrer-Policy "no-referrer" always;

  # The panel asks for none of these, so it should be unable to.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  # No `Strict-Transport-Security` on purpose. This image never terminates
  # TLS — `deploy/` puts it behind a proxy on plain HTTP, and the operator's
  # own terminator is in front of that. HSTS is a statement about a whole
  # hostname for months at a time, and emitting it from behind somebody
  # else's TLS would make that decision for them, including for a deployment
  # deliberately served over HTTP. It belongs on the terminator; the admin
  # guide says so.

  # The client is a single-page app: every route it owns has to come back as
  # index.html, or a reload on any screen but the first is a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
