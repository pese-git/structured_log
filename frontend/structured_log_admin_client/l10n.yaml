# English is the template: every key is written and described there first, and
# `app_ru.arb` follows it. Generated files are committed, not synthetic —
# `flutter gen-l10n` writes them next to the ARBs (see AGENTS.md).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
